<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 345" width="980" height="345" role="img" aria-label="混合检索：同一个查询分别算向量相似度和 BM25 分数；BM25 没有上界，先除以最大值归一化到 0~1，再按权重相加排序。图中数字来自书中召回测试的真实结果：0.7×0.17 + 0.3×1.0 ≈ 0.42。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
