<text x="780.0" y="77.1" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600">MCP Server</text>
<text x="780.0" y="92.7" font-size="10" text-anchor="middle" fill="#6b7280">你的服务 / 工作流</text>
