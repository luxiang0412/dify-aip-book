<line x1="780" y1="100" x2="780" y2="380" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M165.0,130.0 L775.0,130.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-accent)"/>
<text x="470.0" y="124.0" font-size="11.5" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">initialize {protocolVersion, capabilities, clientInfo}</text>
<path d="M775.0,165.0 L165.0,165.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<text x="470.0" y="159.0" font-size="11.5" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">{protocolVersion, capabilities: {tools: {}}, serverInfo}</text>
<path d="M165.0,210.0 L775.0,210.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-muted)"/>
<text x="470.0" y="204.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">notifications/initialized   （通知：没有 id，不回复）</text>
<path d="M165.0,255.0 L775.0,255.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-accent)"/>
<text x="470.0" y="249.0" font-size="11.5" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">tools/list</text>
<path d="M775.0,290.0 L165.0,290.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<text x="470.0" y="284.0" font-size="11.5" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">{tools: [{name, description, inputSchema}]}</text>
<path d="M165.0,335.0 L775.0,335.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-accent)"/>
<text x="470.0" y="329.0" font-size="11.5" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">tools/call {name, arguments}</text>
<path d="M775.0,370.0 L165.0,370.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<text x="470.0" y="364.0" font-size="11.5" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">{content: [{type: &quot;text&quot;, text}], isError}</text>
<text x="470.0" y="405.0" font-size="11.5" text-anchor="middle" fill="#6b7280">传输：stdio（子进程，一行一条 JSON）· Streamable HTTP（POST；回复 JSON 或 SSE；Mcp-Session-Id 头）</text>
</svg>
