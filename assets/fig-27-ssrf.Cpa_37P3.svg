<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="SSRF 防护必须在每一跳都检查：第一次请求访问公网域名，解析出公网 IP，检查通过；对方返回 302 跳到 169.254.169.254（云服务器元数据），跟随重定向时 httpx 的 request 事件钩子再次检查，发现是链路本地地址，拒绝。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>SSRF 防护必须在每一跳都检查：第一次请求访问公网域名，解析出公网 IP，检查通过；对方返回 302 跳到 169.254.169.254（云服务器元数据），跟随重定向时 httpx 的 request 事件钩子再次检查，发现是链路本地地址，拒绝。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">SSRF：每一跳都要检查解析后的 IP</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">mini-dify safe_client = httpx event_hooks[&#x27;request&#x27;]；Dify 交给 Squid 代理（DNS 在代理侧解析）</text>
<rect x="30.0" y="130.0" width="150.0" height="60.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="105.0" y="156.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">HTTP 节点</text>
<text x="105.0" y="173.7" font-size="11" text-anchor="middle" fill="#6b7280">用户配置的 URL</text>
<rect x="250.0" y="80.0" width="190.0" height="54.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="345.0" y="104.1" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">check_url ①</text>
<text x="345.0" y="119.7" font-size="10" text-anchor="middle" fill="#6b7280">attacker.com → 203.0.113.7</text>
<rect x="520.0" y="80.0" width="190.0" height="54.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="615.0" y="104.1" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600">attacker.com</text>
<text x="615.0" y="119.7" font-size="10" text-anchor="middle" fill="#6b7280">返回 302 Location:</text>
<rect x="250.0" y="210.0" width="190.0" height="54.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="345.0" y="234.1" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="600">check_url ②</text>
<text x="345.0" y="249.7" font-size="10" text-anchor="middle" fill="#6b7280">169.254.169.254</text>
<rect x="520.0" y="210.0" width="190.0" height="54.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="615.0" y="234.1" font-size="12" text-anchor="middle" fill="#9ca3af" font-weight="600">云元数据服务</text>
<text x="615.0" y="249.7" font-size="10" text-anchor="middle" fill="#6b7280">IAM 凭证……</text>
<rect x="770.0" y="130.0" width="180.0" height="60.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="860.0" y="156.8" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="600">SSRFError</text>
<text x="860.0" y="173.7" font-size="11" text-anchor="middle" fill="#6b7280">禁止访问内网地址</text>
<path d="M180.0,150.0 L250.0,107.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="200.5" y="113.0" width="29.0" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="215.0" y="124.0" font-size="10.5" text-anchor="middle" fill="#64748b">请求</text>
<path d="M440.0,107.0 L520.0,107.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="458.6" y="91.0" width="42.8" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="480.0" y="102.5" font-size="11" text-anchor="middle" fill="#16a34a">公网 ✓</text>
<path d="M615.0,134.0 L615.0,170.0 L345.0,170.0 L345.0,210.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<rect x="446.5" y="154.0" width="63.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="478.0" y="165.5" font-size="11" text-anchor="middle" fill="#d97706">跟随重定向</text>
<path d="M440.0,237.0 L520.0,237.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-muted)"/>
<rect x="447.6" y="221.0" width="64.8" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="480.0" y="232.5" font-size="11" text-anchor="middle" fill="#6b7280">✗ 不会发出</text>
<path d="M440.0,225.0 L770.0,165.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-bad)"/>
<rect x="592.5" y="173.0" width="90.9" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="638.0" y="184.5" font-size="11" text-anchor="middle" fill="#dc2626">is_link_local</text>
<text x="490.0" y="305.0" font-size="11.5" text-anchor="middle" fill="#6b7280">拦截：private · loopback · link-local · reserved · multicast · unspecified；协议只允许 http/https。剩余缺口：DNS 重绑定（用代理或固定已解析 IP 解决）。</text>
</svg>
