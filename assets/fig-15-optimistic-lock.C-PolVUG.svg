<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="乐观锁：两个标签页都基于 hash h1 编辑；A 先保存成功，服务端 hash 变为 h2；B 带着旧的 h1 保存，服务端发现不匹配返回 409，提示刷新，从而避免 B 悄悄覆盖 A 的修改。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>乐观锁：两个标签页都基于 hash h1 编辑；A 先保存成功，服务端 hash 变为 h2；B 带着旧的 h1 保存，服务端发现不匹配返回 409，提示刷新，从而避免 B 悄悄覆盖 A 的修改。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="339" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">草稿的乐观锁：带着 hash 保存</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">Dify unique_hash / WorkflowHashNotEqualError；mini-dify sync_draft</text>
<text x="30.0" y="115.0" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">标签页 A</text>
<line x1="130" y1="110" x2="910" y2="110" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="30.0" y="195.0" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">服务端草稿</text>
<line x1="130" y1="190" x2="910" y2="190" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="30.0" y="275.0" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">标签页 B</text>
<line x1="130" y1="270" x2="910" y2="270" stroke="#e5e7eb" stroke-width="1.5"/>
<rect x="150.0" y="176.0" width="70.0" height="28.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="185.0" y="193.3" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="600">hash h1</text>
<path d="M185.0,176.0 L185.0,124.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="189.0" y="145.0" width="28.0" height="14" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="203.0" y="155.5" font-size="10" text-anchor="middle" fill="#64748b">加载</text>
<path d="M185.0,204.0 L185.0,256.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="189.0" y="225.0" width="28.0" height="14" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="203.0" y="235.5" font-size="10" text-anchor="middle" fill="#64748b">加载</text>
<rect x="300.0" y="96.0" width="150.0" height="28.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="375.0" y="113.3" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="600">编辑 → 保存(h1)</text>
<path d="M375.0,124.0 L375.0,176.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="374.6" y="144.5" width="68.9" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="409.0" y="155.5" font-size="10.5" text-anchor="middle" fill="#16a34a">h1 == h1 ✓</text>
<rect x="340.0" y="176.0" width="70.0" height="28.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="375.0" y="193.3" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">hash h2</text>
<rect x="560.0" y="256.0" width="150.0" height="28.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="635.0" y="273.3" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="600">编辑 → 保存(h1)</text>
<path d="M635.0,256.0 L635.0,204.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-bad)"/>
<rect x="637.6" y="224.5" width="62.8" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="669.0" y="235.5" font-size="10.5" text-anchor="middle" fill="#dc2626">h1 ≠ h2 ✗</text>
<rect x="600.0" y="176.0" width="70.0" height="28.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="635.0" y="193.3" font-size="11" text-anchor="middle" fill="#14532d" font-weight="600">仍是 h2</text>
<rect x="740.0" y="256.0" width="160.0" height="28.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="820.0" y="273.3" font-size="11" text-anchor="middle" fill="#7f1d1d" font-weight="600">409：请刷新后再编辑</text>
<path d="M710.0,270.0 L740.0,270.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-bad)"/>
<text x="470.0" y="325.0" font-size="12" text-anchor="middle" fill="#6b7280">保存成功会返回新 hash；请求进行中又有修改时保持“未保存”状态，等下一次防抖保存。</text>
</svg>
