<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-label="两种分段：通用分段按长度切块并让相邻块重叠，防止关键句被切断；父子分段用小的子块做匹配、命中后返回它所属的大父块，兼顾检索精度和上下文完整。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>两种分段：通用分段按长度切块并让相邻块重叠，防止关键句被切断；父子分段用小的子块做匹配、命中后返回它所属的大父块，兼顾检索精度和上下文完整。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="399" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">分段：重叠 与 父子</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">chunk_size 控制长度；overlap 让边界附近的内容在两块里都出现</text>
<text x="24.0" y="95.0" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="700">通用分段</text>
<rect x="120.0" y="80.0" width="820.0" height="26.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="530.0" y="98.0" font-size="11" text-anchor="middle" fill="#6b7280">原文 ……第三章 退款政策。购买后七天内可以无理由退款，超过七天需要提供质量问题证明。第四章……</text>
<rect x="120.0" y="122.0" width="330.0" height="26.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="285.0" y="138.3" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="600">chunk 1</text>
<rect x="390.0" y="156.0" width="330.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="555.0" y="172.3" font-size="11" text-anchor="middle" fill="#134e4a" font-weight="600">chunk 2</text>
<rect x="660.0" y="122.0" width="280.0" height="26.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="800.0" y="138.3" font-size="11" text-anchor="middle" fill="#1e3a8a" font-weight="600">chunk 3</text>
<rect x="390.0" y="118.0" width="60.0" height="68.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="420.0" y="200.0" font-size="10.5" text-anchor="middle" fill="#b45309">overlap</text>
<rect x="660.0" y="118.0" width="60.0" height="68.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="690.0" y="200.0" font-size="10.5" text-anchor="middle" fill="#b45309">overlap</text>
<text x="24.0" y="255.0" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="700">父子分段</text>
<rect x="120.0" y="232.0" width="520.0" height="46.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="380.0" y="258.4" font-size="11.5" text-anchor="middle" fill="#4c1d95">父块：第三章 退款政策。购买后七天内……超过七天需要提供质量问题证明。</text>
<rect x="120.0" y="310.0" width="165.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="202.5" y="330.2" font-size="10.5" text-anchor="middle" fill="#1f2937">子块 a：购买后七天内</text>
<path d="M200.0,310.0 L200.0,278.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
<rect x="295.0" y="310.0" width="165.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="377.5" y="330.2" font-size="10.5" text-anchor="middle" fill="#1f2937">子块 b：可以无理由退款</text>
<path d="M375.0,310.0 L375.0,278.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
<rect x="470.0" y="310.0" width="170.0" height="34.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="555.0" y="330.2" font-size="10.5" text-anchor="middle" fill="#14532d">子块 c：超过七天需证明</text>
<path d="M550.0,310.0 L550.0,278.0" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-purple)"/>
<rect x="700.0" y="300.0" width="240.0" height="54.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="820.0" y="324.1" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">问：超过七天需要什么？</text>
<text x="820.0" y="339.7" font-size="10" text-anchor="middle" fill="#6b7280">向量 / BM25 命中 子块 c</text>
<path d="M700.0,327.0 L640.0,327.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="655.0" y="309.0" width="30.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="670.0" y="320.5" font-size="11" text-anchor="middle" fill="#16a34a">匹配</text>
<path d="M820.0,300.0 L820.0,255.0 L640.0,255.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<rect x="693.0" y="239.0" width="74.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="730.0" y="250.5" font-size="11" text-anchor="middle" fill="#7c3aed">返回整个父块</text>
<text x="490.0" y="385.0" font-size="12" text-anchor="middle" fill="#6b7280">小块检索准（语义集中），大块上下文全：父子分段把“匹配单元”和“返回单元”分开。</text>
</svg>
