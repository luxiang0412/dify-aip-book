<text x="761.0" y="190.8" font-size="9" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">Action: ```{&quot;action&quot;: &quot;calculator&quot;, ...}```</text>
