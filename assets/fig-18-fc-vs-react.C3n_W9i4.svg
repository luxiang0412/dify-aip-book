<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-label="两种 Agent 策略的同一次调用：Function Calling 由模型 API 返回结构化 tool_calls，结果以 tool 消息回填；ReAct 由提示词约定文本格式，平台在 Observation 前截停、解析 JSON、把结果写进 scratchpad 再让模型继续。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>两种 Agent 策略的同一次调用：Function Calling 由模型 API 返回结构化 tool_calls，结果以 tool 消息回填；ReAct 由提示词约定文本格式，平台在 Observation 前截停、解析 JSON、把结果写进 scratchpad 再让模型继续。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="419" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">同一个问题，两种 Agent 策略</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">问：1234 × 5678 等于多少？  工具：calculator(expression)</text>
<rect x="20.0" y="70.0" width="460.0" height="330.0" rx="12" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="88.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="600">Function Calling（结构化 tool_calls）</text>
<rect x="500.0" y="70.0" width="460.0" height="330.0" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="512.0" y="88.0" font-size="12" text-anchor="start" fill="#7c3aed" font-weight="600">ReAct（文本格式 + 解析）</text>
<text x="38.0" y="121.0" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="600">→ 模型</text>
<rect x="92.0" y="95.0" width="378.0" height="48.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="281.0" y="122.3" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">messages + tools=[calculator 的 JSON Schema]</text>
<text x="38.0" y="181.0" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="600">← 模型</text>
<rect x="92.0" y="155.0" width="378.0" height="48.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="281.0" y="176.4" font-size="11" text-anchor="middle" fill="#1e3a8a" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">tool_calls=[{id: call_1, name: calculator,</text>
<text x="281.0" y="190.8" font-size="9" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">  arguments: {&quot;expression&quot;: &quot;1234*5678&quot;}}]</text>
<text x="38.0" y="241.0" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="600">平台</text>
<rect x="92.0" y="215.0" width="378.0" height="48.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="281.0" y="242.3" font-size="11" text-anchor="middle" fill="#78350f" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">执行 calculator → &quot;1234*5678 = 7006652&quot;</text>
<text x="38.0" y="301.0" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="600">→ 模型</text>
<rect x="92.0" y="275.0" width="378.0" height="48.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="281.0" y="302.3" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">追加 assistant(tool_calls) + tool(call_1, 结果)</text>
<text x="38.0" y="361.0" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="600">← 模型</text>
<rect x="92.0" y="335.0" width="378.0" height="48.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="281.0" y="362.3" font-size="11" text-anchor="middle" fill="#14532d" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">最终回答（不再有 tool_calls）</text>
<text x="518.0" y="121.0" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="600">→ 模型</text>
<rect x="572.0" y="95.0" width="378.0" height="48.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="761.0" y="116.5" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">system: ReAct 模板（工具列表 + 格式）</text>
<text x="761.0" y="130.8" font-size="9" text-anchor="middle" fill="#6b7280" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">stop=[&quot;Observation:&quot;]</text>
