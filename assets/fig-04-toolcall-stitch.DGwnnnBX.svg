<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" width="1040" height="380" role="img" aria-label="工具调用的参数是分片到达的：同一个 index 的 id、name、arguments 片段需要按顺序拼接，流结束时才得到完整、可解析的 ToolCall。Provider 层负责拼接，业务代码只拿到最后一片里的完整结果。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>工具调用的参数是分片到达的：同一个 index 的 id、name、arguments 片段需要按顺序拼接，流结束时才得到完整、可解析的 ToolCall。Provider 层负责拼接，业务代码只拿到最后一片里的完整结果。</title>
