<text x="230.8" y="163.0" font-size="10.5" text-anchor="middle" fill="#2563eb">读回落</text>
<text x="180.0" y="292.0" font-size="11" text-anchor="middle" fill="#16a34a">写入只留在本轮</text>
<rect x="350.0" y="200.0" width="240.0" height="74.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470.0" y="227.1" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">第 1 轮子池</text>
<text x="470.0" y="243.3" font-size="10.5" text-anchor="middle" fill="#6b7280">loop.item = 1 · loop.index = 1</text>
<text x="470.0" y="257.0" font-size="10.5" text-anchor="middle" fill="#6b7280">sq.y = 1</text>
<path d="M470.0,200.0 L470.0,135.0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-accent)"/>
<rect x="450.2" y="152.0" width="39.5" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="470.0" y="163.0" font-size="10.5" text-anchor="middle" fill="#2563eb">读回落</text>
<text x="470.0" y="292.0" font-size="11" text-anchor="middle" fill="#16a34a">写入只留在本轮</text>
<rect x="640.0" y="200.0" width="240.0" height="74.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="760.0" y="227.1" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="600">第 2 轮子池</text>
<text x="760.0" y="243.3" font-size="10.5" text-anchor="middle" fill="#6b7280">loop.item = 2 · loop.index = 2</text>
<text x="760.0" y="257.0" font-size="10.5" text-anchor="middle" fill="#6b7280">sq.y = 4</text>
<path d="M760.0,200.0 L658.5,135.0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-accent)"/>
<rect x="689.5" y="152.0" width="39.5" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="709.2" y="163.0" font-size="10.5" text-anchor="middle" fill="#2563eb">读回落</text>
<text x="760.0" y="292.0" font-size="11" text-anchor="middle" fill="#16a34a">写入只留在本轮</text>
<rect x="300.0" y="310.0" width="340.0" height="34.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="470.0" y="330.6" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">output = [9, 1, 4]（按 index 收集，与完成顺序无关）</text>
</svg>
