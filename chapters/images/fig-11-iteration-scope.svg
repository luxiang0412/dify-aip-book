<text x="180.0" y="243.3" font-size="10.5" text-anchor="middle" fill="#6b7280">loop.item = 3 · loop.index = 0</text>
<text x="180.0" y="257.0" font-size="10.5" text-anchor="middle" fill="#6b7280">sq.y = 9</text>
<path d="M180.0,200.0 L281.5,135.0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-accent)"/>
