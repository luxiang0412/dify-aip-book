<text x="385.0" y="231.8" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">开放接口</text>
<text x="385.0" y="248.7" font-size="11" text-anchor="middle" fill="#6b7280">/v1 · /web · /mcp · webhook</text>
