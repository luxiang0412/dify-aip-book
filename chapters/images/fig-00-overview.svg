<text x="125.0" y="343.6" font-size="11" text-anchor="middle" fill="#6b7280">Chatflow / WebApp</text>
<rect x="270.0" y="70.0" width="230.0" height="330.0" rx="12" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="282.0" y="88.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="600">API 进程（FastAPI）</text>
