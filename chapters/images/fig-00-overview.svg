<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img" aria-label="mini-dify 总体架构：浏览器通过 HTTP + SSE 访问 API；API 把运行作为 job 交给执行端；引擎调度节点，节点调用模型、工具、知识库；事件经队列或 Redis Stream 回到 API。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>mini-dify 总体架构：浏览器通过 HTTP + SSE 访问 API；API 把运行作为 job 交给执行端；引擎调度节点，节点调用模型、工具、知识库；事件经队列或 Redis Stream 回到 API。</title>
