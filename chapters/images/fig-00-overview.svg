<text x="385.0" y="326.8" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="600">App Generator</text>
<text x="385.0" y="343.6" font-size="11" text-anchor="middle" fill="#6b7280">prepare → 派发 → 订阅</text>
<rect x="580.0" y="70.0" width="440.0" height="330.0" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/>
