7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="1039" height="429" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">mini-dify 总体架构（v1.0）</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">和 Dify 同构：API 只收请求、推事件；执行在线程或 Celery Worker 里</text>
