<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="五种应用形态都可以画成图：Completion 是一条直线，Chat 多了记忆，Agent 是 LLM 和工具之间的循环，Workflow 是任意 DAG，Chatflow 是 DAG 加记忆和流式回复节点。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
