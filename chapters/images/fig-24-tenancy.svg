<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="三类调用者用三种凭证进入平台：控制台用户用登录 token（每次从数据库确认成员和角色）、API 调用方用应用 API Key（只能调用该应用的已发布版本）、访客通过分享链接（应用需显式开启）。所有数据访问都带 tenant_id 过滤，跨租户访问返回 404。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>三类调用者用三种凭证进入平台：控制台用户用登录 token（每次从数据库确认成员和角色）、API 调用方用应用 API Key（只能调用该应用的已发布版本）、访客通过分享链接（应用需显式开启）。所有数据访问都带 tenant_id 过滤，跨租户访问返回 404。</title>
