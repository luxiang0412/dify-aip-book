<rect x="470.0" y="275.0" width="250.0" height="60.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="595.0" y="302.3" font-size="11.5" text-anchor="middle" fill="#134e4a">site_enabled 才可用</text>
<text x="595.0" y="317.2" font-size="9.5" text-anchor="middle" fill="#6b7280">匿名 user = visitor-xxx</text>
