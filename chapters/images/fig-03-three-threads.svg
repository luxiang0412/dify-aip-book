<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-label="一次运行涉及三类线程：HTTP 线程只读队列并写回 SSE；工作线程跑引擎；节点在引擎的线程池里并行执行。job、事件、命令三条通道把它们连起来。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
