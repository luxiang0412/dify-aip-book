<text x="470.0" y="485.0" font-size="12" text-anchor="middle" fill="#6b7280">三条通道：job（往下）· 事件（往上）· 命令（从外面进来）。把它们换成 Celery + Redis，API 和执行端就能分机部署（第 25 章）。</text>
