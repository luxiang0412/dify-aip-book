<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="网络分包不认事件边界也不认字符边界：一次 read 可能停在 JSON 中间、甚至一个汉字的 UTF-8 字节中间。客户端要用流式解码，并按空行切分、把最后一段不完整的内容留在 buffer 里。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>网络分包不认事件边界也不认字符边界：一次 read 可能停在 JSON 中间、甚至一个汉字的 UTF-8 字节中间。客户端要用流式解码，并按空行切分、把最后一段不完整的内容留在 buffer 里。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="329" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">SSE 客户端的两个坑：包边界 ≠ 事件边界 ≠ 字符边界</text>
<rect x="30.0" y="80.0" width="283.4" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="171.7" y="100.3" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">data: {&quot;event&quot;:&quot;text_chunk&quot;,&quot;text&quot;:&quot;你&quot;}</text>
<text x="315.4" y="102.0" font-size="10" text-anchor="start" fill="#9ca3af" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">\n\n</text>
<rect x="341.4" y="80.0" width="283.4" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="483.2" y="100.3" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">data: {&quot;event&quot;:&quot;text_chunk&quot;,&quot;text&quot;:&quot;好&quot;}</text>
<text x="626.9" y="102.0" font-size="10" text-anchor="start" fill="#9ca3af" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">\n\n</text>
<rect x="652.9" y="80.0" width="253.3" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="779.5" y="100.3" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">data: {&quot;event&quot;:&quot;workflow_finished&quot;}</text>
<text x="908.2" y="102.0" font-size="10" text-anchor="start" fill="#9ca3af" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">\n\n</text>
<line x1="251.08319999999992" y1="66" x2="251.08319999999992" y2="128" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>
<text x="251.1" y="62.0" font-size="10.5" text-anchor="middle" fill="#dc2626">read() #1 结束</text>
<line x1="468.98799999999983" y1="66" x2="468.98799999999983" y2="128" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>
<text x="469.0" y="62.0" font-size="10.5" text-anchor="middle" fill="#dc2626">read() #2 结束</text>
<line x1="804.8599999999997" y1="66" x2="804.8599999999997" y2="128" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>
<text x="804.9" y="62.0" font-size="10.5" text-anchor="middle" fill="#dc2626">read() #3 结束</text>
<text x="251.1" y="146.0" font-size="11" text-anchor="middle" fill="#b91c1c">切在“你”的 3 个 UTF-8 字节中间</text>
<text x="469.0" y="146.0" font-size="11" text-anchor="middle" fill="#b91c1c">切在 JSON 中间</text>
<rect x="30.0" y="175.0" width="900.0" height="130.0" rx="12" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="42.0" y="193.0" font-size="12" text-anchor="start" fill="#16a34a" font-weight="600">正确的处理</text>
<rect x="50.0" y="210.0" width="260.0" height="70.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="180.0" y="235.6" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">流式解码</text>
<text x="180.0" y="251.2" font-size="10" text-anchor="middle" fill="#6b7280">decode(value, { stream: true })</text>
<text x="180.0" y="264.2" font-size="10" text-anchor="middle" fill="#6b7280">不完整的字节留到下次再解</text>
<rect x="350.0" y="210.0" width="260.0" height="70.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="480.0" y="235.6" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">按空行切分</text>
<text x="480.0" y="251.2" font-size="10" text-anchor="middle" fill="#6b7280">blocks = buffer.split(&#x27;\n\n&#x27;)</text>
<text x="480.0" y="264.2" font-size="10" text-anchor="middle" fill="#6b7280">buffer = blocks.pop()  # 残片留着</text>
<rect x="650.0" y="210.0" width="260.0" height="70.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="780.0" y="235.6" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">每个完整 block</text>
<text x="780.0" y="251.2" font-size="10" text-anchor="middle" fill="#6b7280">取 data: 行 → JSON.parse</text>
<text x="780.0" y="264.2" font-size="10" text-anchor="middle" fill="#6b7280">→ 按 event 分发</text>
<path d="M310.0,245.0 L350.0,245.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<path d="M610.0,245.0 L650.0,245.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
</svg>
