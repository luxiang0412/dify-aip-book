<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" role="img" aria-label="节点失败后的处理顺序：先看是否还能重试；重试用完后按错误策略处理：无策略则终止整个运行；默认值策略用默认输出继续走所有出边；异常分支策略只走 fail-branch 出口。后两者让节点以 exception 结束，运行最终为 partial-succeeded。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>节点失败后的处理顺序：先看是否还能重试；重试用完后按错误策略处理：无策略则终止整个运行；默认值策略用默认输出继续走所有出边；异常分支策略只走 fail-branch 出口。后两者让节点以 exception 结束，运行最终为 partial-succeeded。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="379" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">节点失败之后：重试 → 错误策略</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">graphon ErrorHandler.handle_node_failure / mini-dify GraphEngine._on_failed</text>
<rect x="30.0" y="160.0" width="130.0" height="50.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="95.0" y="188.9" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="600">NodeRunFailed</text>
<rect x="210.0" y="150.0" width="150.0" height="70.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="285.0" y="174.6" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">还能重试？</text>
<text x="285.0" y="191.5" font-size="11" text-anchor="middle" fill="#6b7280">retry_enabled 且</text>
<text x="285.0" y="205.8" font-size="11" text-anchor="middle" fill="#6b7280">次数 &lt; max_retries</text>
<path d="M160.0,185.0 L210.0,185.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="210.0" y="280.0" width="150.0" height="56.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="285.0" y="298.6" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600">NodeRunRetry</text>
<text x="285.0" y="314.2" font-size="10" text-anchor="middle" fill="#6b7280">等 retry_interval 后</text>
<text x="285.0" y="327.2" font-size="10" text-anchor="middle" fill="#6b7280">重新入队</text>
<path d="M285.0,220.0 L285.0,280.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<rect x="287.5" y="244.0" width="19.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="297.0" y="255.5" font-size="11" text-anchor="middle" fill="#d97706">是</text>
<path d="M210.0,308.0 L95.0,308.0 L95.0,210.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-warn)"/>
<rect x="98.8" y="292.0" width="52.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="124.8" y="303.5" font-size="11" text-anchor="middle" fill="#d97706">再跑一次</text>
<rect x="410.0" y="150.0" width="150.0" height="70.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="485.0" y="188.9" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">error_strategy？</text>
<path d="M360.0,185.0 L410.0,185.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="375.5" y="167.0" width="19.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="385.0" y="178.5" font-size="11" text-anchor="middle" fill="#64748b">否</text>
<path d="M560.0,185.0 L600.0,185.0 L600.0,108.0 L620.0,108.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-bad)"/>
<text x="624.0" y="74.0" font-size="11" text-anchor="start" fill="#b91c1c" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">None（默认）</text>
<rect x="620.0" y="80.0" width="230.0" height="56.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="735.0" y="111.6" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="600">终止整个运行</text>
<text x="860.0" y="113.0" font-size="11" text-anchor="start" fill="#7f1d1d">GraphRunFailed</text>
<path d="M560.0,185.0 L600.0,185.0 L600.0,203.0 L620.0,203.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<text x="624.0" y="169.0" font-size="11" text-anchor="start" fill="#b45309" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">default-value</text>
<rect x="620.0" y="175.0" width="230.0" height="56.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="735.0" y="200.1" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600">输出 = 默认值 + error_message</text>
<text x="735.0" y="215.7" font-size="10" text-anchor="middle" fill="#6b7280">照常走所有出边</text>
<text x="860.0" y="208.0" font-size="11" text-anchor="start" fill="#78350f">节点 exception → partial-succeeded</text>
<path d="M560.0,185.0 L600.0,185.0 L600.0,313.0 L620.0,313.0" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a-warn)"/>
<text x="624.0" y="279.0" font-size="11" text-anchor="start" fill="#b45309" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">fail-branch</text>
<rect x="620.0" y="285.0" width="230.0" height="56.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="735.0" y="310.1" font-size="12" text-anchor="middle" fill="#78350f" font-weight="600">输出 error_message / error_type</text>
<text x="735.0" y="325.7" font-size="10" text-anchor="middle" fill="#6b7280">只走 “fail-branch” 出口</text>
<text x="860.0" y="318.0" font-size="11" text-anchor="start" fill="#78350f">节点 exception → partial-succeeded</text>
</svg>
