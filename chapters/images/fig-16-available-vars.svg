<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="选中节点能引用的变量 = 它的祖先节点的输出（沿入边反向遍历）+ 若在迭代里则还有迭代的 item/index 和迭代外部的祖先 + 系统变量和环境变量；下游和无关分支上的节点不可选。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>选中节点能引用的变量 = 它的祖先节点的输出（沿入边反向遍历）+ 若在迭代里则还有迭代的 item/index 和迭代外部的祖先 + 系统变量和环境变量；下游和无关分支上的节点不可选。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="379" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">可用变量 = 祖先节点的输出</text>
<text x="24.0" y="54.0" font-size="12" text-anchor="start" fill="#6b7280">沿入边反向 DFS（Dify getBeforeNodesInSameBranchIncludeParent / mini-dify availableVars）</text>
<rect x="30.0" y="170.0" width="86.0" height="34.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="73.0" y="190.6" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">开始</text>
<rect x="150.0" y="120.0" width="86.0" height="34.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="193.0" y="140.6" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">HTTP</text>
<rect x="150.0" y="220.0" width="86.0" height="34.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="193.0" y="240.6" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">IF</text>
<rect x="270.0" y="245.0" width="86.0" height="34.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="313.0" y="265.6" font-size="12" text-anchor="middle" fill="#9ca3af" font-weight="600">检索</text>
<rect x="390.0" y="80.0" width="330.0" height="170.0" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="402.0" y="98.0" font-size="12" text-anchor="start" fill="#7c3aed" font-weight="600">迭代（parentId 子图）</text>
<rect x="410.0" y="140.0" width="86.0" height="34.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="453.0" y="160.6" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">迭代开始</text>
<rect x="530.0" y="140.0" width="86.0" height="34.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="573.0" y="160.6" font-size="12" text-anchor="middle" fill="#1e3a8a" font-weight="600">LLM</text>
<rect x="640.0" y="200.0" width="70.0" height="34.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="675.0" y="220.6" font-size="12" text-anchor="middle" fill="#9ca3af" font-weight="600">代码</text>
<rect x="760.0" y="150.0" width="86.0" height="34.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="803.0" y="170.6" font-size="12" text-anchor="middle" fill="#9ca3af" font-weight="600">汇总</text>
<rect x="870.0" y="150.0" width="70.0" height="34.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="905.0" y="170.6" font-size="12" text-anchor="middle" fill="#9ca3af" font-weight="600">结束</text>
<path d="M116.0,187.0 L150.0,137.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<path d="M116.0,187.0 L150.0,237.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<path d="M236.0,245.0 L270.0,260.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<path d="M236.0,137.0 L390.0,160.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<path d="M496.0,157.0 L530.0,157.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<path d="M616.0,165.0 L640.0,210.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<path d="M720.0,167.0 L760.0,167.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<path d="M846.0,167.0 L870.0,167.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<text x="573.0" y="128.0" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="700">选中</text>
<rect x="30.0" y="300.0" width="640.0" height="62.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="350.0" y="334.9" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="600"></text>
<text x="46.0" y="322.0" font-size="12" text-anchor="start" fill="#1e3a8a" font-weight="700">LLM 节点的变量选择器里会出现：</text>
<text x="46.0" y="346.0" font-size="12" text-anchor="start" fill="#1f2937">迭代.item / 迭代.index（当前项） · 开始.* · HTTP.body … · IF.result … · sys.* · env.*</text>
<text x="690.0" y="322.0" font-size="11.5" text-anchor="start" fill="#6b7280">不会出现：代码（下游）、汇总 / 结束（迭代之后）、</text>
<text x="690.0" y="342.0" font-size="11.5" text-anchor="start" fill="#6b7280">检索（另一条分支，不是 LLM 的祖先）</text>
</svg>
