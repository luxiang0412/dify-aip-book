<path d="M390.0,245.0 L255.0,339.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<rect x="285.0" y="276.5" width="75.0" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="322.5" y="287.5" font-size="10.5" text-anchor="middle" fill="#7c3aed">XREAD BLOCK</text>
<path d="M255.0,381.0 L390.0,360.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-bad)"/>
<rect x="303.3" y="355.0" width="38.5" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="322.5" y="366.0" font-size="10.5" text-anchor="middle" fill="#dc2626">RPUSH</text>
<path d="M610.0,355.0 L740.0,355.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-bad)"/>
<rect x="631.7" y="339.5" width="86.5" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="675.0" y="350.5" font-size="10.5" text-anchor="middle" fill="#dc2626">每 0.1s 取命令</text>
<text x="500.0" y="445.0" font-size="12" text-anchor="middle" fill="#6b7280">任何一个 API 实例都能服务任何任务的 SSE 和停止；Stream 是日志而不是管道，先发布的事件不会丢。</text>
</svg>
