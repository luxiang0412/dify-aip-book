<text x="675.0" y="127.0" font-size="10.5" text-anchor="middle" fill="#64748b">取 job</text>
<path d="M740.0,240.0 L610.0,235.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<rect x="645.3" y="222.0" width="59.5" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="675.0" y="233.0" font-size="10.5" text-anchor="middle" fill="#7c3aed">XADD 事件</text>
<path d="M390.0,225.0 L255.0,164.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<rect x="285.0" y="179.0" width="75.0" height="14.5" rx="3" fill="#ffffff" opacity="0.92"/>
