<text x="152.5" y="209.5" font-size="11.5" text-anchor="middle" fill="#7f1d1d" font-weight="600">POST /stop → send(Abort)</text>
<rect x="30.0" y="250.0" width="240.0" height="160.0" rx="12" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="42.0" y="268.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="600">API 实例 #2</text>
<rect x="50.0" y="280.0" width="205.0" height="34.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="152.5" y="300.4" font-size="11.5" text-anchor="middle" fill="#1f2937" font-weight="600">prepare → job</text>
<rect x="50.0" y="322.0" width="205.0" height="34.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="152.5" y="342.4" font-size="11.5" text-anchor="middle" fill="#1e3a8a" font-weight="600">subscribe(task_id) → SSE</text>
<rect x="50.0" y="364.0" width="205.0" height="34.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="152.5" y="384.4" font-size="11.5" text-anchor="middle" fill="#7f1d1d" font-weight="600">POST /stop → send(Abort)</text>
<rect x="370.0" y="70.0" width="260.0" height="350.0" rx="12" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="382.0" y="88.0" font-size="12" text-anchor="start" fill="#dc2626" font-weight="600">Redis</text>
<rect x="390.0" y="100.0" width="220.0" height="60.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500.0" y="127.1" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="600">Celery 队列</text>
<text x="500.0" y="142.7" font-size="10" text-anchor="middle" fill="#6b7280">mini_dify.run_workflow(job)</text>
<rect x="390.0" y="200.0" width="220.0" height="70.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="500.0" y="225.6" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600">Stream</text>
<text x="500.0" y="241.2" font-size="10" text-anchor="middle" fill="#6b7280">mini-dify:events:{task_id}</text>
<text x="500.0" y="254.2" font-size="10" text-anchor="middle" fill="#6b7280">XADD / XREAD BLOCK</text>
<rect x="390.0" y="320.0" width="220.0" height="70.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="500.0" y="345.6" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="600">List</text>
<text x="500.0" y="361.2" font-size="10" text-anchor="middle" fill="#6b7280">mini-dify:commands:{task_id}</text>
<text x="500.0" y="374.2" font-size="10" text-anchor="middle" fill="#6b7280">RPUSH / LRANGE+DEL</text>
<rect x="740.0" y="100.0" width="230.0" height="70.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="855.0" y="132.1" font-size="12" text-anchor="middle" fill="#4c1d95" font-weight="600">Celery Worker #1</text>
<text x="855.0" y="147.7" font-size="10" text-anchor="middle" fill="#6b7280">execute(job)：引擎 + 节点</text>
