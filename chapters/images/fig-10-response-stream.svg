<line x1="390" y1="158" x2="390" y2="172" stroke="#2563eb" stroke-width="1"/>
<line x1="425" y1="158" x2="425" y2="172" stroke="#2563eb" stroke-width="1"/>
<line x1="460" y1="158" x2="460" y2="172" stroke="#2563eb" stroke-width="1"/>
<line x1="495" y1="158" x2="495" y2="172" stroke="#2563eb" stroke-width="1"/>
<line x1="530" y1="158" x2="530" y2="172" stroke="#2563eb" stroke-width="1"/>
<line x1="565" y1="158" x2="565" y2="172" stroke="#2563eb" stroke-width="1"/>
<text x="385.0" y="150.0" font-size="10.5" text-anchor="middle" fill="#2563eb">流式产生 token</text>
<rect x="170.0" y="205.0" width="140.0" height="20.0" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<circle cx="310" cy="215" r="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="318.0" y="200.0" font-size="10.5" text-anchor="start" fill="#16a34a">http 先完成</text>
<rect x="150.0" y="262.0" width="60.0" height="28.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="180.0" y="279.3" font-size="11" text-anchor="middle" fill="#14532d">翻译：</text>
<rect x="214.0" y="262.0" width="386.0" height="28.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="407.0" y="281.0" font-size="11" text-anchor="middle" fill="#14532d">llm1 的 token 逐个转发（当前片段正好是它）</text>
<rect x="606.0" y="262.0" width="80.0" height="28.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
