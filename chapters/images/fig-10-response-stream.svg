<text x="490.0" y="98.5" font-size="11.5" text-anchor="middle" fill="#1f2937">／ 来源：</text>
<rect x="540.0" y="80.0" width="200.0" height="30.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="640.0" y="98.5" font-size="11.5" text-anchor="middle" fill="#1e3a8a" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">{{#http.body#}}</text>
<text x="30.0" y="100.0" font-size="11.5" text-anchor="start" fill="#6b7280">片段（cursor →）</text>
<path d="M140.0,330.0 L920.0,330.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<rect x="881.6" y="312.0" width="30.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
