<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-label="两种传数据的方式对比：沿边传递时，结束节点想用开始节点的数据就得让中间每个节点转手；共享变量池（Dify 的选择）里，边只表示顺序，任何节点按 selector 直接读取上游输出。" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
<title>两种传数据的方式对比：沿边传递时，结束节点想用开始节点的数据就得让中间每个节点转手；共享变量池（Dify 的选择）里，边只表示顺序，任何节点按 selector 直接读取上游输出。</title>
<defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-neutral-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-accent-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-warn-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-purple-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-teal-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="399" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="15" text-anchor="start" fill="#1f2937" font-weight="700">数据怎么在节点间流动：沿边传递 vs 共享变量池</text>
<rect x="20.0" y="60.0" width="450.0" height="300.0" rx="12" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="78.0" font-size="12" text-anchor="start" fill="#64748b" font-weight="600">方案 A：沿边传递（数据流图）</text>
<rect x="40.0" y="110.0" width="90.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="85.0" y="133.9" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">开始</text>
<rect x="145.0" y="110.0" width="90.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="190.0" y="133.9" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">HTTP</text>
<rect x="250.0" y="110.0" width="90.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="295.0" y="133.9" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">LLM</text>
<rect x="355.0" y="110.0" width="90.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400.0" y="133.9" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">结束</text>
<path d="M130.0,130.0 L145.0,130.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<text x="137.5" y="180.0" font-size="11.5" text-anchor="middle" fill="#b45309" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">开始 → HTTP：{query}</text>
<path d="M235.0,130.0 L250.0,130.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<text x="242.5" y="202.0" font-size="11.5" text-anchor="middle" fill="#b45309" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">HTTP → LLM：{query, body}</text>
<path d="M340.0,130.0 L355.0,130.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a-neutral)"/>
<text x="347.5" y="224.0" font-size="11.5" text-anchor="middle" fill="#b45309" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">LLM → 结束：{query, body, text}</text>
<text x="245.0" y="270.0" font-size="12" text-anchor="middle" fill="#b45309" font-weight="600">结束节点要用 query → 中间每个节点都得转手</text>
<text x="245.0" y="292.0" font-size="12" text-anchor="middle" fill="#6b7280">节点之间强耦合；改一个节点的输出会波及下游所有节点</text>
<text x="245.0" y="330.0" font-size="11" text-anchor="middle" fill="#9ca3af">（Node-RED、n8n 的 items 模型）</text>
<rect x="500.0" y="60.0" width="460.0" height="300.0" rx="12" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="512.0" y="78.0" font-size="12" text-anchor="start" fill="#2563eb" font-weight="600">方案 B：共享变量池（Dify / mini-dify）</text>
<rect x="520.0" y="110.0" width="90.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="565.0" y="133.9" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">开始</text>
<rect x="625.0" y="110.0" width="90.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="670.0" y="133.9" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">HTTP</text>
<rect x="730.0" y="110.0" width="90.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="775.0" y="133.9" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">LLM</text>
<rect x="835.0" y="110.0" width="90.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="880.0" y="133.9" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="600">结束</text>
<path d="M610.0,130.0 L625.0,130.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<path d="M715.0,130.0 L730.0,130.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<path d="M820.0,130.0 L835.0,130.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#a-muted)"/>
<text x="730.0" y="100.0" font-size="11" text-anchor="middle" fill="#6b7280">边只表示执行顺序</text>
<rect x="540.0" y="250.0" width="400.0" height="84.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="740.0" y="295.9" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="600"></text>
<text x="560.0" y="270.0" font-size="12" text-anchor="start" fill="#1e3a8a" font-weight="700">VariablePool</text>
<rect x="555.0" y="282.0" width="88.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="599.0" y="305.3" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">start.query</text>
<rect x="651.0" y="282.0" width="88.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="695.0" y="305.3" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">http.body</text>
<rect x="747.0" y="282.0" width="88.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="791.0" y="305.3" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">llm.text</text>
<rect x="843.0" y="282.0" width="88.0" height="40.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="887.0" y="305.3" font-size="11" text-anchor="middle" fill="#1f2937" font-family="'JetBrains Mono', Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace">sys.user_id</text>
<path d="M565.0,150.0 L599.0,282.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="562.8" y="193.4" width="19.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="572.3" y="204.9" font-size="11" text-anchor="middle" fill="#16a34a">写</text>
<path d="M670.0,150.0 L695.0,282.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-ok)"/>
<rect x="663.8" y="193.4" width="19.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="673.2" y="204.9" font-size="11" text-anchor="middle" fill="#16a34a">写</text>
<path d="M760.0,282.0 L765.0,150.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-accent)"/>
<rect x="763.5" y="186.8" width="19.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="773.0" y="198.3" font-size="11" text-anchor="middle" fill="#2563eb">读</text>
<path d="M880.0,150.0 L887.0,282.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-accent)"/>
<rect x="867.3" y="200.0" width="76.4" height="15" rx="3" fill="#ffffff" opacity="0.92"/>
<text x="905.5" y="211.5" font-size="11" text-anchor="middle" fill="#2563eb">读 llm.text</text>
</svg>
